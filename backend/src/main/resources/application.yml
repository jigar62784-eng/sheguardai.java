server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: sheguard-backend
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

sheguard:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5000"
      - "http://localhost:5500"
      - "http://localhost:8000"
      - "http://127.0.0.1:5500"
      - "http://127.0.0.1:8000"
      - "null" # For file:// origin during local HTML testing
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:serviceAccountKey.json}
    database-url: ${FIREBASE_DATABASE_URL:}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:sheguard-safety.appspot.com}
  routing:
    osrm-url: ${OSRM_SERVICE_URL:https://router.project-osrm.org}
  emergency:
    provider: ${EMERGENCY_NOTIFICATION_PROVIDER:auto} # options: twilio, email, log
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-phone: ${TWILIO_FROM_PHONE:}

logging:
  level:
    root: INFO
    com.sheguard: DEBUG
