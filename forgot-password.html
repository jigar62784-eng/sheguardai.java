<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SheGuard</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="app-header">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="brand-name">SheGuard</span>
      </a>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Back to Login</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Password Recovery</h1>
          <p>Enter your registered email address to receive an official password reset link.</p>
        </div>

        <div id="resetAlert" class="alert alert-danger" style="display: none;" role="alert"></div>
        <div id="resetSuccess" class="alert alert-success" style="display: none;" role="status"></div>

        <form id="forgotPasswordForm" novalidate>
          <div class="form-group">
            <label for="resetEmail" class="form-label">Email Address <span class="required">*</span></label>
            <input type="email" id="resetEmail" class="form-control" required placeholder="name@example.com" autocomplete="email">
          </div>

          <button type="submit" id="resetSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
            <span>Send Recovery Email</span>
          </button>
        </form>

        <div class="auth-footer">
          Remembered your password? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { authService } from './js/auth.js';
    import { showToast } from './js/ui.js';

    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('resetEmail');
    const alertBox = document.getElementById('resetAlert');
    const successBox = document.getElementById('resetSuccess');
    const submitBtn = document.getElementById('resetSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      successBox.style.display = 'none';

      const email = emailInput.value.trim();
      if (!email) {
        alertBox.textContent = 'Please enter your registered email address.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> Sending email...`;

      try {
        await authService.resetPassword(email);
        successBox.textContent = `A password reset link has been dispatched to ${email}. Please check your inbox and spam folder.`;
        successBox.style.display = 'block';
        submitBtn.innerHTML = `<span>Email Sent</span>`;
      } catch (err) {
        alertBox.textContent = authService.mapAuthError(err);
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Send Recovery Email</span>`;
      }
    });
  </script>
</body>
</html>
