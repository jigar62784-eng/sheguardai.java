<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SheGuard</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a href="#loginForm" class="skip-link">Skip to login form</a>

  <header class="app-header">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="brand-name">SheGuard</span>
      </a>

      <div class="nav-actions">
        <a href="register.html" class="btn btn-primary btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Welcome Back</h1>
          <p>Log in to access your safety dashboard and family locator.</p>
        </div>

        <div id="authAlert" class="alert alert-danger" style="display: none;" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail" class="form-label">Email Address <span class="required">*</span></label>
            <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com" autocomplete="email">
            <div id="emailError" class="form-error" style="display: none;"></div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
              <label for="loginPassword" class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
              <a href="forgot-password.html" style="font-size: var(--font-size-xs);">Forgot password?</a>
            </div>
            <input type="password" id="loginPassword" class="form-control" required placeholder="Enter your password" autocomplete="current-password">
            <div id="passwordError" class="form-error" style="display: none;"></div>
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
            <span>Log In to SheGuard</span>
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Sign up securely</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireGuest } from './js/guards.js';
    import { authService } from './js/auth.js';
    import { showToast } from './js/ui.js';

    await requireGuest();

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const alertBox = document.getElementById('authAlert');
    const submitBtn = document.getElementById('loginSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        alertBox.textContent = 'Please enter both your email address and password.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> Signing in...`;

      try {
        await authService.login(email, password);
        showToast('Login successful. Redirecting...', 'success');

        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect') ? decodeURIComponent(params.get('redirect')) : 'dashboard.html';
        
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 500);
      } catch (err) {
        alertBox.textContent = authService.mapAuthError(err);
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Log In to SheGuard</span>`;
      }
    });
  </script>
</body>
</html>
